# Runs PostgreSQL and Redis locally so you don't have to install them by hand.
# Start:  docker compose up -d      Stop:  docker compose down
services:
  db:
    image: postgres:16
    container_name: payreliant-db
    environment:
      POSTGRES_USER: payreliant
      POSTGRES_PASSWORD: payreliant_dev
      POSTGRES_DB: payreliant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: payreliant-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
